name: node-dispatched-tasks-poc

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "6079:5540"
    depends_on:
      redis:
        condition: service_healthy

  nestjs-tasks-owner:
    build:
      context: ..
      dockerfile: poc/nestjs-tasks-owner/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4001
      OWNER_RUN_SCHEDULER: "true"
      NODE_APP_INSTANCE: "0"
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy

  nestjs-emitter:
    build:
      context: ..
      dockerfile: poc/nestjs-emitter/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      - nestjs-tasks-owner

  express-emitter:
    build:
      context: ..
      dockerfile: poc/express-emitter/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      - nestjs-tasks-owner
